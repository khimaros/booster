# pushing a tag like v0.1.0 builds a signed release apk and publishes it as a github release.
# needs repository secrets: BOOSTER_KEYSTORE_BASE64 (the keystore, base64), BOOSTER_KEYSTORE_PASSWORD,
# BOOSTER_KEY_ALIAS and BOOSTER_KEY_PASSWORD.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: install android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOSTER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "missing secret BOOSTER_KEYSTORE_BASE64; refusing to publish an unsigned apk" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: build
        env:
          BOOSTER_KEYSTORE: ${{ runner.temp }}/release.jks
          BOOSTER_KEYSTORE_PASSWORD: ${{ secrets.BOOSTER_KEYSTORE_PASSWORD }}
          BOOSTER_KEY_ALIAS: ${{ secrets.BOOSTER_KEY_ALIAS }}
          BOOSTER_KEY_PASSWORD: ${{ secrets.BOOSTER_KEY_PASSWORD }}
        run: make precommit release VERSION="${GITHUB_REF_NAME#v}"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="booster-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "$GITHUB_REF_NAME" --generate-notes
